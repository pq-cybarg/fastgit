[build-system]
requires = ["setuptools>=61", "wheel", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "fastgit"
version = "0.1.1"
description = "Bare-metal C git reimplementation - Python bindings to libfastgit"
readme = "README.md"
license = {text = "MIT"}
authors = [{name="pq-cybarg", email="resistant@tuta.com"}]
maintainers = [{name="pq-cybarg", email="resistant@tuta.com"}]
keywords = ["git", "vcs", "sha256"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Software Development :: Version Control"]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/pq-cybarg/fastgit"
Repository = "https://github.com/pq-cybarg/fastgit"

[tool.setuptools]
packages = ["fastgit"]

[tool.setuptools.package-data]
fastgit = ["*.so", "*.dylib"]
